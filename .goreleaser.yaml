# Builds and publishes a release when a vX.Y.Z tag is pushed
# (.github/workflows/release.yml); AGENTS.md §14.1 has the process.
# Check it with `goreleaser check`; try it with `make snapshot`.
version: 2

project_name: meow

builds:
  - main: ./cmd/meow
    binary: meow
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # The tar.gz for macOS and Linux, and the zip for Windows, feed the
  # Homebrew cask and the Scoop manifest, which take one archive per platform.
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
  # A zip for macOS and Linux too, for anyone who'd rather have one.
  - id: zip
    formats: [zip]
    format_overrides:
      - goos: windows
        formats: [none] # already a zip above
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # The annotated tag's message, after its subject line, holds the notes.
  header: "{{ .TagBody }}"

homebrew_casks:
  - name: meow
    ids: [default]
    binaries: [meow]
    homepage: https://github.com/ericliswan/termeownal
    description: Terminal client for Instagram DMs
    skip_upload: auto # not for prereleases such as v0.2.0-rc1
    repository:
      owner: ericliswan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # The binary isn't signed or notarized, so macOS would refuse to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/meow"]
          end

scoops:
  - name: meow
    ids: [default]
    homepage: https://github.com/ericliswan/termeownal
    description: Terminal client for Instagram DMs
    license: AGPL-3.0-only
    skip_upload: auto # not for prereleases
    repository:
      owner: ericliswan
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
